# Rate-limit login/signup per client IP at the proxy (slows password guessing without touching the auth code).
# NOTE: behind another reverse proxy/CDN, make nginx see the real client IP (real_ip module) or all users share one bucket.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

# Rate-limit upload/detect per client IP (added 2026-10-03): these trigger CPU-bound model inference
# (uploads validated + stored, detections run a full model forward pass), so unlike the rest of the API an
# unauthenticated or low-cost client can otherwise burn significant server time for free. 20r/m is generous for
# a real user (nobody uploads/scans faster than that) but blocks naive scripted abuse.
limit_req_zone $binary_remote_addr zone=inference_zone:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy (added 2026-10-03, see CLAUDE.md section 25 for how each directive was derived
    # from the actual built app, not guessed):
    #   script-src 'self' only - the production build (frontend/dist) has zero inline <script> tags, and a
    #     grep of the whole built bundle found zero eval()/new Function()/Worker()/WebAssembly calls, so no
    #     unsafe-eval or blob worker allowance is needed.
    #   style-src needs 'unsafe-inline' - this UI uses React's style={{}} prop (26 files) and GSAP's direct
    #     inline-style DOM manipulation (StaggeredMenu.jsx and others) extensively; moving all of that to
    #     nonces/hashes would be a much larger rework than a header change, so this is an accepted, explicit
    #     trade-off, not an oversight - also needs fonts.googleapis.com for the Google Fonts stylesheet link.
    #   font-src needs fonts.gstatic.com - where the actual woff2 files are served from.
    #   img-src needs data: (Grad-CAM/ELA/spectrogram heatmaps are all data: URIs from the API, see CLAUDE.md
    #     sections 11/21) and blob: (local file preview before upload - SpecimenDossier.jsx/FilmstripScan.jsx/
    #     PixelGridScan.jsx all createObjectURL() the selected file for an <img>/<video>/<audio> preview).
    #   media-src needs blob: for the same local video/audio preview elements.
    #   connect-src 'self' - all API calls are same-origin (proxied via /api/, see the location blocks below).
    # NOT verified in a live browser console in this environment (no browser automation tool was available
    # when this was written) - verified statically instead (grep of the built bundle + every src/ file that
    # references an external URL or object/data URI). If this ships and anything breaks, check the browser
    # console for a CSP violation report before assuming it's unrelated.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/upload/ {
        limit_req zone=inference_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/v1/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location /api/v1/detect/ {
        limit_req zone=inference_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/v1/detect/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        # first request after start loads the models (CLIP backbone included); give synchronous scans room
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        # first request after start loads the models (CLIP backbone included); give synchronous scans room
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # hashed build assets are immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
