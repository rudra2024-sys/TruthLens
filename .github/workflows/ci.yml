name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch/PR supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Python 3.11 = the version the Docker image runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (CPU-only torch, see requirements.txt)
        run: pip install -r requirements-dev.txt

      # The model checkpoints are gitignored (~334MB), so the `models`-marked tests are excluded here; they skip
      # themselves anyway when a checkpoint is missing. Run them locally with `pytest -m models`.
      - name: Run tests
        run: python -m pytest -m "not models" -ra --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # There is no frontend test script; a production build is the compile/import check.
      - run: npm run build
